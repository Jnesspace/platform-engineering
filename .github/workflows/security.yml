name: security

on:
  pull_request:
  push:
    branches: [main, stage, dev]
  # Scanners find new things without the code changing — a rule ships, a CVE is
  # published. A weekly run means the answer to "is this repo clean" has a date
  # on it rather than being whenever someone last opened a PR.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: v0.72.0

jobs:
  # BLOCKING. A live credential in the tree is not a finding to triage, it is an
  # incident, and merging on top of it makes the rotation harder.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          # Full history: a secret that was committed and then "removed" in a
          # later commit is still published. The worktree scan below would call
          # that clean.
          fetch-depth: 0
          persist-credentials: false

      # run-pinned.sh is what .pre-commit-config.yaml calls too: same version,
      # same checksum, same binary. --redact everywhere, because this is a public
      # reference repo and a findings log that prints the secret has published it
      # a second time.
      - name: worktree
        run: |
          ./.github/scripts/run-pinned.sh gitleaks dir . \
            --config .gitleaks.toml --no-banner --redact --exit-code 1

      - name: history
        if: ${{ !cancelled() }}
        run: |
          ./.github/scripts/run-pinned.sh gitleaks git . \
            --config .gitleaks.toml --no-banner --redact --exit-code 1

      - name: what to do when this fails
        if: failure()
        run: |
          # shellcheck disable=SC2016  # backticks are markdown here, not a subshell
          {
            echo '### gitleaks found a credential'
            echo
            echo '1. Rotate it. It is published; deleting the commit does not unpublish it.'
            echo '2. Then, if and only if it was never valid, record the fingerprint in'
            echo '   `.gitleaksignore`, in the same PR that explains why.'
            echo
            echo 'There is no bypass that skips step 1.'
          } >>"$GITHUB_STEP_SUMMARY"

  # ADVISORY. Account numbers and Spacelift entity ids are not credentials, but
  # in a public repo an account number next to a documented role-naming
  # convention is a targeting aid. Known instances live in .tf and .md files, so
  # blocking on them would be red on arrival; this reports them every run
  # instead, and the count only goes down.
  secret-hygiene:
    name: secret-hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: account-identifying literals
        run: |
          ./.github/scripts/run-pinned.sh gitleaks dir . \
            --config .github/gitleaks-hygiene.toml --no-banner --redact \
            --exit-code 0 --report-format json --report-path hygiene.json
          n="$(jq 'length' hygiene.json)"
          {
            printf '### account-identifying literals: %s\n\n' "$n"
            if [ "$n" -gt 0 ]; then
              echo 'Replace each with a variable. These are advisory today; they become'
              echo 'blocking once the count reaches zero (fold the rules from'
              echo '.github/gitleaks-hygiene.toml into .gitleaks.toml and delete this job).'
              echo
              jq -r '.[] | "- `\(.File):\(.StartLine)` — \(.RuleID)"' hygiene.json
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  # ADVISORY. 100+ findings on arrival, almost all of the form "this module does
  # not enable <production hardening>" — correct advice for a production root and
  # wrong for a wrapper module that also serves ephemeral demo environments.
  # Blocking on that set would train everyone to bypass the gate, which then
  # covers the findings that do matter.
  iac-scan:
    name: iac-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      # pip, not a checkov action: one fewer third-party action in the trust
      # chain, and the version lives in a file Dependabot already watches.
      - name: install checkov
        run: pip install --require-hashes -r .github/requirements-ci.txt

      - name: checkov
        run: |
          checkov --config-file .checkov.yaml \
            --output cli --output sarif --output-file-path console,checkov.sarif

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: ${{ env.TRIVY_VERSION }}
          skip-dirs: '**/.terraform,bakes'
          format: sarif
          output: trivy.sarif
          exit-code: '0'  # advisory; the gate is secret-scan, not this

      # Trivy also picks up examples/jimmy-app/Dockerfile on its own — it detects
      # config types by content — so it is called out separately here only so the
      # summary answers "was the app image checked?" without reading the SARIF.
      - name: dockerfile
        if: ${{ !cancelled() }}
        run: |
          [ -f trivy.sarif ] || { echo "no trivy report — scan step did not produce one"; exit 0; }
          {
            printf '### examples/jimmy-app/Dockerfile\n\n'
            jq -r '
              [.runs[0].results[]
               | select(.locations[0].physicalLocation.artifactLocation.uri
                        | test("Dockerfile"))]
              | if length == 0 then "clean"
                else .[] | "- \(.ruleId): \(.message.text)" end' trivy.sarif
            printf '\nBase-image CVE scanning belongs in the app repo that builds and pushes\n'
            printf 'the image, not here — jimmy-app is a stub showing what an app repo ships.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: summary
        if: ${{ !cancelled() }}
        run: |
          for f in checkov.sarif trivy.sarif; do
            [ -f "$f" ] || continue
            printf '### %s: %s finding(s)\n\n' "$f" "$(jq '.runs[0].results | length' "$f")"
            jq -r '.runs[0].results | group_by(.ruleId)
                   | map({id: .[0].ruleId, n: length}) | sort_by(-.n) | .[]
                   | "- \(.id) x\(.n)"' "$f" | head -20
            printf '\n'
          done >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: sarif
          path: '*.sarif'
          if-no-files-found: warn
          retention-days: 7

  # The only job in this repo that holds a write permission, and it is isolated
  # for one reason: the job above reads contributor-authored Terraform and
  # Dockerfiles through two scanners with large dependency trees. A job that
  # processes untrusted input must not also hold a token that can write to the
  # repo's security surface — so the scanner runs with contents:read, hands over
  # an artifact, and this job (which touches nothing but that artifact) holds the
  # write.
  #
  # Push-only because a fork PR's GITHUB_TOKEN is read-only regardless; running
  # it there would produce a permission error that reads like a real failure.
  publish-sarif:
    name: publish-sarif
    needs: iac-scan
    # Only on a successful scan: without the artifact there is nothing to publish
    # and download-artifact would fail in a way that reads like a security error.
    if: ${{ github.event_name != 'pull_request' && needs.iac-scan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sarif
      # continue-on-error: code scanning upload needs the feature enabled on the
      # repo (free for public, GHAS for private). A repo without it should not
      # get a red X for a capability it was never given.
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        continue-on-error: true
        with:
          sarif_file: .
          category: iac-scan

  # The required status check for this workflow. Only the blocking job counts:
  # secret-scan. iac-scan and secret-hygiene are advisory by design and must not
  # be able to block a merge — if they could, they would be silenced instead.
  security-gate:
    name: security-gate
    needs: secret-scan
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - env:
          RESULT: ${{ needs.secret-scan.result }}
        run: |
          echo "secret-scan: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::secret-scan failed"; exit 1; }
