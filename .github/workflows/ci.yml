name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: fmt
        run: terraform fmt -check -recursive -diff

      # Every directory with a .tf file is a root, a module or a module example; validate each.
      - name: validate
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          failed=0
          for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            if ! (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate); then
              echo "::error::validate failed in $dir"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1  # v2.4.0
      - run: opa fmt --list --fail policies/
      - run: opa check policies/
      - run: opa test policies/ --verbose
