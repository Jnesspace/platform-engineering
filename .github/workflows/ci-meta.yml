name: ci-meta

# CI verifies the repo; this verifies CI. Whoever can edit a workflow can run
# code in this repo's context, so .github/ is privilege-bearing in exactly the
# way bootstrap/ is, and it gets the same treatment: reviewed by CODEOWNERS,
# checked by a gate, and pinned.
on:
  pull_request:
  push:
    branches: [main, stage, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-hygiene:
    name: ci-hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false

      # Every step below runs even after an earlier one fails: four independent
      # findings in one run beats four pushes to discover them one at a time.
      #
      # actionlint type-checks expressions, catches unknown contexts, and pipes
      # every `run:` block through shellcheck (preinstalled on the runner).
      - name: actionlint
        run: ./.github/scripts/run-pinned.sh actionlint -color

      # The check that keeps the SHA pins from decaying. Pinning once is easy;
      # staying pinned across a year of edits needs a machine.
      - name: action pins
        if: ${{ !cancelled() }}
        run: ./.github/scripts/check-action-pins.sh

      # shellcheck and yamllint from pip, not the runner image: the image ships
      # shellcheck but its version moves when the image does, and these are the
      # exact versions .pre-commit-config.yaml installs.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: install linters
        if: ${{ !cancelled() }}
        # --require-hashes: every package in the compiled file is sha256-verified,
        # so the scanner supply chain is pinned the same way the actions are.
        run: pip install --require-hashes -r .github/requirements-ci.txt

      # These scripts run inside the same jobs as everything else and, via
      # pre-commit, on developer machines. bash 3.2 is the target because macOS
      # still ships it.
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck --shell=bash --severity=style .github/scripts/*.sh

      # blueprints/*.yaml and examples/*/platform.yaml are inputs to elevated
      # engines. A duplicate key there silently discards a value at run time.
      - name: yamllint
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2046  # the file list must word-split
          yamllint --strict -c .yamllint.yaml $(git ls-files '*.yaml' '*.yml')
