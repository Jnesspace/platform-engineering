# Spacelift Blueprint: deploy a whole app's resources via patterns/app-factory —
# the same engine and modules/aws/* the GitOps platform.yaml path uses, filled
# via a form. The target Space must have the AWS integration attached (as the
# app-factory stack does).
name: app
description: >-
  Deploy a standard app's cloud resources (object storage + secret + a scoped
  app IAM role) without writing Terraform. Creates a stack rooted at
  patterns/app-factory, driven by an inline shopping list built from the form —
  the exact engine and modules the GitOps shopping-list path composes.

inputs:
  - id: app_name
    name: App name
    description: Lowercase letters/digits/hyphens (e.g. acme-billing). Prefixes every resource.
    type: short_text
  - id: team
    name: Owning team
    type: short_text

stack:
  name: app-${{ inputs.app_name }}
  space: root
  description: App ${{ inputs.app_name }} resources, requested via Blueprint by ${{ inputs.team }}.
  labels:
    - blueprint
    - app-factory
  administrative: false
  auto_deploy: false
  vcs:
    provider: GITHUB
    repository: platform-engineering
    branch: main
    project_root: patterns/app-factory
  environment:
    variables:
      # Inline shopping list built from the form — consumed by app-factory's shopping_list_yaml.
      - name: TF_VAR_shopping_list_yaml
        value: '{ name: "${{ inputs.app_name }}", cloud: aws, resources: { object_storage: [{ name: uploads }], secrets: [{ name: app-secrets }] } }'
      - name: AWS_DEFAULT_REGION
        value: us-east-1
  vendor:
    terraform:
      manage_state: true
      version: "1.5.7"
