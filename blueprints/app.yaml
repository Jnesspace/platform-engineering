# Blueprint template body. Deploys a whole app (bucket + secret + one scoped app
# IAM role) via patterns/app-factory, AWS integration attached. Add database/
# compute to the shopping list below when needed.
inputs:
  - id: app_name
    name: App name
    description: Prefixes every resource. Must satisfy app-factory's name gate, which is the intersection of the S3/RDS/Secrets Manager rules.
    type: short_text
    validations:
      required: true
      min_length: 3
      max_length: 30
      pattern: "^[a-z0-9]([a-z0-9]|-[a-z0-9])*$"
  - id: team
    name: Owning team
    description: "Recorded on the stack as a team: label — the audit trail for who ordered this."
    type: short_text
    validations:
      required: true
      min_length: 2
      max_length: 40
      pattern: "^[a-z0-9]([a-z0-9]|-[a-z0-9])*$"
  - id: aws_integration_id
    name: AWS integration ID
    description: Spacelift AWS integration used to deploy. No default — an account-specific ID must not live in git.
    type: short_text
    validations:
      required: true
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
  - id: worker_pool_id
    name: Private worker pool ID
    description: This stack gets write AWS credentials and mints an IAM role, so it must not share workers with co-tenant runs. See worker-pools/.
    type: short_text
    validations:
      required: true
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
  - id: space_id
    name: Space
    description: Space the new stack lands in. Must reach the AWS integration, the worker pool, and bootstrap/governance's policy set.
    type: short_text
    default: root
  # How the app assumes the role this stack mints. Getting this wrong used to produce a role
  # no workload could assume; app-factory now fails the plan instead, so the two fields below
  # must agree.
  - id: trust_mode
    name: How the app assumes its role
    description: "irsa = the app runs on EKS as a ServiceAccount (fill in the cluster OIDC provider ARN below). ec2 = the non-Kubernetes case."
    type: select
    options:
      - ec2
      - irsa
    default: ec2
  - id: eks_oidc_provider_arn
    name: EKS cluster OIDC provider ARN
    description: "Required when trust mode is irsa; leave blank for ec2. Get it with: aws eks describe-cluster --name <cluster> --query cluster.identity.oidc.issuer"
    type: short_text
    default: ""
  - id: environment
    name: Environment lane
    description: Becomes the Environment tag on every vended resource. `prod` is deliberately not offered — a form-created stack may not claim the prod lane, which is provisioned through bootstrap/environments and the promotion branches.
    type: select
    options:
      - dev
      - stage
    default: dev
  - id: region
    name: AWS region
    type: select
    options:
      - us-east-1
      - us-east-2
      - us-west-2
      - eu-west-1
    default: us-east-1

stack:
  name: app-${{ inputs.app_name }}
  space: ${{ inputs.space_id }}
  description: App ${{ inputs.app_name }} resources, via Blueprint by ${{ inputs.team }}.
  # `elevated` is what bootstrap/governance's audit keys off: it asserts this stack has a
  # private pool, deletion protection, and policy reach. A form-created stack that mints an
  # IAM role is elevated whether or not it feels like it.
  labels:
    - blueprint
    - app-factory
    - elevated
    - team:${{ inputs.team }}
  administrative: false
  auto_deploy: false
  protect_from_deletion: true
  secret_masking_enabled: true
  worker_pool: ${{ inputs.worker_pool_id }}
  vcs:
    provider: GITHUB
    repository: platform-engineering
    branch: main
    project_root: patterns/app-factory
  vendor:
    terraform:
      manage_state: true
      version: "1.5.7"
  attachments:
    clouds:
      aws:
        id: ${{ inputs.aws_integration_id }}
        read: true
        write: true
  environment:
    variables:
      - name: TF_VAR_shopping_list_yaml
        value: '{ name: "${{ inputs.app_name }}", cloud: aws, resources: { object_storage: [{ name: uploads }], secrets: [{ name: app-secrets }] } }'
      - name: TF_VAR_trust_mode
        value: ${{ inputs.trust_mode }}
      - name: TF_VAR_eks_oidc_provider_arn
        value: ${{ inputs.eks_oidc_provider_arn }}
      # Environment and Owner are two of the three tags enforce-required-tags.rego requires;
      # app-factory derives Project from the app name.
      - name: TF_VAR_environment
        value: ${{ inputs.environment }}
      - name: TF_VAR_owner
        value: ${{ inputs.team }}
      - name: TF_VAR_region
        value: ${{ inputs.region }}
      - name: AWS_DEFAULT_REGION
        value: ${{ inputs.region }}
