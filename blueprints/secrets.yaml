# Spacelift Blueprint: the non-developer / ticketing path for a Secrets Manager secret (modules/aws/secrets).
name: secrets
description: >-
  Request a Secrets Manager secret without writing Terraform. Creates a stack
  whose root is modules/aws/secrets, with the form inputs passed as TF_VAR_* —
  the exact module app-factory composes.

inputs:
  - id: secret_name
    name: Secret name
    description: Secrets Manager secret name (lowercase, hyphens).
    type: short_text
  - id: team
    name: Owning team
    description: Used for the stack description and the secret's team tag.
    type: short_text
  - id: initial_value
    name: Initial secret value (leave blank to create an empty shell and set the value out-of-band)
    type: secret
    default: ""

stack:
  name: secrets-${{ inputs.secret_name }}
  space: root
  description: Secrets Manager secret ${{ inputs.secret_name }}, requested via Blueprint by ${{ inputs.team }}.
  labels:
    - blueprint
    - secrets
  administrative: false
  auto_deploy: false
  vcs:
    provider: GITHUB
    repository: platform-engineering
    branch: main
    project_root: modules/aws/secrets
  environment:
    variables:
      - name: TF_VAR_name
        value: ${{ inputs.secret_name }}
      - name: TF_VAR_initial_value
        value: ${{ inputs.initial_value }}
        secret: true
      - name: TF_VAR_tags
        value: '{ team = "${{ inputs.team }}", managed_by = "blueprint" }'
  vendor:
    terraform:
      manage_state: true
      version: "1.5.7"
