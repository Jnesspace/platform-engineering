# Blueprint template body. Deploys a Secrets Manager secret via patterns/app-factory
# (modules/aws/secrets), AWS integration attached.
inputs:
  - id: app_name
    name: App name
    description: Prefixes the resource. Must satisfy app-factory's name gate, which is the intersection of the S3/RDS/Secrets Manager rules.
    type: short_text
    validations:
      required: true
      min_length: 3
      max_length: 30
      pattern: "^[a-z0-9]([a-z0-9]|-[a-z0-9])*$"
  - id: team
    name: Owning team
    description: "Recorded on the stack as a team: label — the audit trail for who ordered this."
    type: short_text
    validations:
      required: true
      min_length: 2
      max_length: 40
      pattern: "^[a-z0-9]([a-z0-9]|-[a-z0-9])*$"
  - id: aws_integration_id
    name: AWS integration ID
    description: Spacelift AWS integration used to deploy. No default — an account-specific ID must not live in git.
    type: short_text
    validations:
      required: true
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
  - id: worker_pool_id
    name: Private worker pool ID
    description: This stack gets write AWS credentials and mints an IAM role, so it must not share workers with co-tenant runs. See worker-pools/.
    type: short_text
    validations:
      required: true
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
  - id: space_id
    name: Space
    description: Space the new stack lands in. Must reach the AWS integration, the worker pool, and bootstrap/governance's policy set.
    type: short_text
    default: root
  - id: environment
    name: Environment lane
    description: Becomes the Environment tag on every vended resource. `prod` is deliberately not offered — a form-created stack may not claim the prod lane, which is provisioned through bootstrap/environments and the promotion branches.
    type: select
    options:
      - dev
      - stage
    default: dev
  - id: region
    name: AWS region
    type: select
    options:
      - us-east-1
      - us-east-2
      - us-west-2
      - eu-west-1
    default: us-east-1

stack:
  name: secret-${{ inputs.app_name }}
  space: ${{ inputs.space_id }}
  description: Secret for ${{ inputs.app_name }}, via Blueprint by ${{ inputs.team }}.
  # `elevated` is what bootstrap/governance's audit keys off: it asserts this stack has a
  # private pool, deletion protection, and policy reach. A form-created stack that mints an
  # IAM role is elevated whether or not it feels like it.
  labels:
    - blueprint
    - secrets
    - elevated
    - team:${{ inputs.team }}
  administrative: false
  auto_deploy: false
  protect_from_deletion: true
  secret_masking_enabled: true
  worker_pool: ${{ inputs.worker_pool_id }}
  vcs:
    provider: GITHUB
    repository: platform-engineering
    branch: main
    project_root: patterns/app-factory
  vendor:
    terraform:
      manage_state: true
      version: "1.5.7"
  attachments:
    clouds:
      aws:
        id: ${{ inputs.aws_integration_id }}
        read: true
        write: true
  environment:
    variables:
      - name: TF_VAR_shopping_list_yaml
        value: '{ name: "${{ inputs.app_name }}", cloud: aws, resources: { secrets: [{ name: app-secrets }] } }'
      # No Kubernetes in the form path, so the app role trusts EC2. app-factory fails the
      # plan rather than minting a role no workload can assume.
      - name: TF_VAR_trust_mode
        value: ec2
      # Environment and Owner are two of the three tags enforce-required-tags.rego requires;
      # app-factory derives Project from the app name.
      - name: TF_VAR_environment
        value: ${{ inputs.environment }}
      - name: TF_VAR_owner
        value: ${{ inputs.team }}
      - name: TF_VAR_region
        value: ${{ inputs.region }}
      - name: AWS_DEFAULT_REGION
        value: ${{ inputs.region }}
